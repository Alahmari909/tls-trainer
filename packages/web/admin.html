<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

		<link rel="icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest-admin.json" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-admin.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TLS Admin" />

		<meta name="theme-color" content="#020610" />

		<meta property="og:image" content="/og-image.png" />
		<title>TLS Admin</title>

		<script>
// iOS PWA standalone: prevent navigation links from opening in Safari
(function(){
  if(navigator.standalone){
    document.addEventListener('click',function(e){
      var a=e.target.closest('a[href]');
      if(!a)return;
      var href=a.getAttribute('href');
      if(!href||href.startsWith('http')||href.startsWith('mailto')||href.startsWith('tel'))return;
      e.preventDefault();
      if(window.history&&window.history.pushState){
        window.history.pushState(null,'',href);
        window.dispatchEvent(new PopStateEvent('popstate',{state:window.history.state}));
      }
    },true);
  }
})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
