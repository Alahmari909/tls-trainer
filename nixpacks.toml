# Railway / Nixpacks build config for TLS Trainer (web deployment only)
#
# Why this exists:
# The monorepo contains packages/desktop (electron) and packages/mobile (expo).
# On a clean install Railway runs electron's postinstall, which tries to download
# the Electron binary and crashes the image build ("Failed to build an image").
# The web server needs NO native postinstall scripts, so we skip them and build
# only the web package.

[phases.install]
cmds = ["bun install --frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = ["bun run build:web"]

[start]
cmd = "bun run packages/web/src/server.ts"
